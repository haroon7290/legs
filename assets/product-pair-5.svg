<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"><defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbfaf7"/><stop offset=".55" stop-color="#f1eee8"/><stop offset="1" stop-color="#e6e1d9"/></linearGradient>
